  </g>
  <circle cx="644" cy="557" r="20" fill="#F6E6DF"/>
  <path d="M636 557 l6 6 l11 -12" fill="none" stroke="#C27F6D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="552" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B2220">Termine frei</text>
  <text x="676" y="574" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9A8A84">Di – Sa, 9 – 19 Uhr</text>

  <!-- Leistungen -->
  <g filter="url(#shadow)">
    <rect x="80" y="652" width="330" height="124" rx="20" fill="#FFFFFF"/>
    <rect x="435" y="652" width="330" height="124" rx="20" fill="#FFFFFF"/>
    <rect x="790" y="652" width="330" height="124" rx="20" fill="#FFFFFF"/>

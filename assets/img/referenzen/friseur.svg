  <g fill="#F6E6DF">
    <circle cx="132" cy="714" r="28"/>
    <circle cx="487" cy="714" r="28"/>
    <circle cx="842" cy="714" r="28"/>
  </g>
  <g fill="none" stroke="#C27F6D" stroke-width="2.6" stroke-linecap="round">
    <path d="M122 704 l20 20 M142 704 l-20 20"/>
    <path d="M477 724 c6-22 14-22 20 0"/>
    <path d="M832 724 c4-10 16-10 20 0 M842 700 v12"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="180" y="708" font-size="19" font-weight="bold" fill="#2B2220">Schneiden</text>
    <text x="180" y="734" font-size="14" fill="#9A8A84">Damen, Herren &amp; Kinder</text>
    <text x="535" y="708" font-size="19" font-weight="bold" fill="#2B2220">Färben</text>
    <text x="535" y="734" font-size="14" fill="#9A8A84">Strähnen, Balayage, Tönung</text>
    <text x="890" y="708" font-size="19" font-weight="bold" fill="#2B2220">Styling</text>
    <text x="890" y="734" font-size="14" fill="#9A8A84">Hochsteckfrisuren &amp; mehr</text>
  </g>

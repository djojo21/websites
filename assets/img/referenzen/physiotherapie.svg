<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Beispielentwurf: Website für die fiktive Praxis Physio am Park">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5EEEA"/>
      <stop offset="1" stop-color="#9CD1C8"/>
    </linearGradient>
    <clipPath id="imgClip">
      <rect x="660" y="190" width="460" height="370" rx="30"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#17403D" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- Browser -->
  <rect width="1200" height="44" fill="#ECE8E3"/>
  <circle cx="26" cy="22" r="6.5" fill="#D6D0C8"/>
  <circle cx="48" cy="22" r="6.5" fill="#D6D0C8"/>
  <circle cx="70" cy="22" r="6.5" fill="#D6D0C8"/>
  <rect x="420" y="11" width="360" height="22" rx="11" fill="#FFFFFF"/>
  <text x="600" y="26.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8E8A96">Beispielprojekt · Physio am Park</text>

  <!-- Infoleiste -->
  <rect y="44" width="1200" height="36" fill="#E6F3F1"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2C6A65">
    <text x="80" y="67">Alle Kassen &amp; Privat</text>
    <text x="1120" y="67" text-anchor="end">Termine nach Vereinbarung</text>
  </g>

  <!-- Navigation -->
  <circle cx="102" cy="122" r="22" fill="#1F7A74"/>
  <path d="M102 110 v24 M90 122 h24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <text x="136" y="129" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#17403D">Physio am Park</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A6461">
    <text x="540" y="128">Leistungen</text>
    <text x="648" y="128">Team</text>
    <text x="716" y="128">Praxis</text>
    <text x="790" y="128">Kontakt</text>
  </g>
  <rect x="924" y="100" width="196" height="44" rx="22" fill="#1F7A74"/>
  <text x="1022" y="127" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Termin vereinbaren</text>

  <!-- Hero-Text -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="80" y="246" font-size="13" font-weight="bold" letter-spacing="3.5" fill="#1F7A74">PHYSIOTHERAPIE &amp; PRÄVENTION</text>
    <text x="77" y="320" font-size="54" font-weight="bold" fill="#17403D">Bewegung ist die</text>
    <text x="77" y="386" font-size="54" font-weight="bold" fill="#1F7A74">beste Therapie.</text>
  </g>
  <rect x="80" y="420" width="420" height="12" rx="6" fill="#DDE9E7"/>
  <rect x="80" y="444" width="340" height="12" rx="6" fill="#DDE9E7"/>
  <rect x="80" y="490" width="214" height="56" rx="28" fill="#1F7A74"/>
  <text x="187" y="523" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Termin vereinbaren</text>
  <rect x="310" y="491" width="160" height="54" rx="27" fill="none" stroke="#1F7A74" stroke-width="1.6"/>
  <text x="390" y="523" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F7A74">Leistungen</text>

  <!-- Bild: Park -->
  <rect x="660" y="190" width="460" height="370" rx="30" fill="url(#sky)"/>
  <g clip-path="url(#imgClip)">
    <circle cx="1030" cy="270" r="40" fill="#FFFFFF" opacity="0.7"/>
    <path d="M640 470 C760 420 880 450 980 430 S1120 410 1140 420 V580 H640 Z" fill="#6FB5A8"/>
    <path d="M640 510 C780 480 900 500 1020 486 S1130 480 1140 482 V580 H640 Z" fill="#3E958A"/>
    <rect x="742" y="380" width="8" height="70" fill="#2B5E58"/>
    <circle cx="746" cy="364" r="40" fill="#2E8378"/>
    <circle cx="722" cy="390" r="26" fill="#3A978B"/>
    <rect x="1046" y="370" width="8" height="70" fill="#2B5E58"/>
    <circle cx="1050" cy="352" r="44" fill="#2E8378"/>
    <!-- Person beim Dehnen -->
    <g stroke="#17403D" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M900 360 L900 440"/>
      <path d="M900 372 L860 320"/>
      <path d="M900 372 L940 320"/>
      <path d="M900 440 L874 508"/>
      <path d="M900 440 L930 508"/>
    </g>
    <circle cx="900" cy="338" r="17" fill="#17403D"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="500" width="250" height="76" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="650" cy="538" r="20" fill="#E6F3F1"/>
  <path d="M641 538 l6 6 l11 -12" fill="none" stroke="#1F7A74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="682" y="533" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#17403D">Hausbesuche möglich</text>
  <text x="682" y="555" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6C8582">nach ärztlicher Verordnung</text>

  <!-- Leistungen -->
  <rect y="610" width="1200" height="190" fill="#F3F8F7"/>
  <g filter="url(#shadow)">
    <rect x="80" y="646" width="330" height="124" rx="20" fill="#FFFFFF"/>
    <rect x="435" y="646" width="330" height="124" rx="20" fill="#FFFFFF"/>
    <rect x="790" y="646" width="330" height="124" rx="20" fill="#FFFFFF"/>
  </g>
  <g fill="#E6F3F1">
    <rect x="106" y="672" width="48" height="48" rx="14"/>
    <rect x="461" y="672" width="48" height="48" rx="14"/>
    <rect x="816" y="672" width="48" height="48" rx="14"/>
  </g>
  <g fill="none" stroke="#1F7A74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 708 l10 -12 l8 8 l8 -12"/>
    <path d="M473 696 c8 -8 16 8 24 0 M473 706 c8 -8 16 8 24 0"/>
    <path d="M828 708 c6 -16 18 -16 24 0 M840 684 v8"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="172" y="694" font-size="18" font-weight="bold" fill="#17403D">Krankengymnastik</text>
    <text x="172" y="718" font-size="14" fill="#6C8582">Kräftigung &amp; Mobilität</text>
    <text x="527" y="694" font-size="18" font-weight="bold" fill="#17403D">Manuelle Therapie</text>
    <text x="527" y="718" font-size="14" fill="#6C8582">Gezielt gegen Schmerzen</text>
    <text x="882" y="694" font-size="18" font-weight="bold" fill="#17403D">Massage</text>
    <text x="882" y="718" font-size="14" fill="#6C8582">Entspannung &amp; Lockerung</text>
  </g>
</svg>

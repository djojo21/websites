  <rect x="640" y="196" width="460" height="390" fill="none" stroke="#B8935A" stroke-width="1.5"/>
  <g fill="#E9E2D3">
    <path d="M740 300 L890 236 L1040 300 Z"/>
    <rect x="740" y="306" width="300" height="16"/>
    <rect x="762" y="330" width="22" height="150"/>
    <rect x="818" y="330" width="22" height="150"/>
    <rect x="874" y="330" width="22" height="150"/>
    <rect x="930" y="330" width="22" height="150"/>
    <rect x="986" y="330" width="22" height="150"/>
    <rect x="740" y="484" width="300" height="14"/>
    <rect x="726" y="502" width="328" height="14"/>
  </g>
  <circle cx="890" cy="280" r="9" fill="#B8935A"/>


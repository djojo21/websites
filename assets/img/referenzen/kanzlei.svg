  <text x="146" y="110" font-family="Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="4" fill="#B8935A">RECHTSANWÄLTE</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#C5CCD8">

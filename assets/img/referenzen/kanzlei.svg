  <circle cx="26" cy="22" r="6.5" fill="#D6D0C8"/>
  <circle cx="48" cy="22" r="6.5" fill="#D6D0C8"/>
  <circle cx="70" cy="22" r="6.5" fill="#D6D0C8"/>
  <rect x="420" y="11" width="360" height="22" rx="11" fill="#FFFFFF"/>
  <text x="600" y="26.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8E8A96">Beispielprojekt · Kanzlei am Markt</text>

  <!-- Navigation -->
  <rect y="44" width="1200" height="92" fill="#1B2A41"/>
  <rect x="80" y="66" width="48" height="48" fill="none" stroke="#B8935A" stroke-width="2"/>
  <text x="104" y="98" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-size="20" fill="#B8935A">KM</text>

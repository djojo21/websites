    <text x="664" y="96">Anwälte</text>
    <text x="746" y="96">Aktuelles</text>
    <text x="836" y="96">Kontakt</text>
  </g>
  <rect x="940" y="68" width="180" height="44" fill="#B8935A"/>
  <text x="1030" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1B2A41">Erstberatung</text>

  <!-- Hero-Text -->
  <text x="80" y="244" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="3.5" fill="#A07B43">RECHTSBERATUNG FÜR PRIVAT &amp; GEWERBE</text>
  <g font-family="Georgia, 'DejaVu Serif', serif" font-size="58" fill="#1B2A41">
    <text x="77" y="322">Ihr Recht in</text>
    <text x="77" y="394">guten Händen.</text>
  </g>
  <rect x="80" y="422" width="56" height="3" fill="#B8935A"/>
  <rect x="80" y="448" width="400" height="11" rx="5.5" fill="#DDD8CD"/>
  <rect x="80" y="470" width="330" height="11" rx="5.5" fill="#DDD8CD"/>
  <rect x="80" y="510" width="230" height="54" fill="#1B2A41"/>

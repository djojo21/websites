    <text x="463" y="672">Familienrecht</text>
    <text x="818" y="672">Mietrecht</text>
  </g>
  <g fill="#E4E0D7">
    <rect x="108" y="694" width="260" height="10" rx="5"/>
    <rect x="108" y="714" width="200" height="10" rx="5"/>
    <rect x="463" y="694" width="260" height="10" rx="5"/>
    <rect x="463" y="714" width="200" height="10" rx="5"/>
    <rect x="818" y="694" width="260" height="10" rx="5"/>
    <rect x="818" y="714" width="200" height="10" rx="5"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A07B43">

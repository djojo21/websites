<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Beispielentwurf: Website für das fiktive Café Kornblume">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2F3E33" flood-opacity="0.14"/>
    </filter>
    <radialGradient id="coffee" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9A6440"/>
      <stop offset="1" stop-color="#5A3520"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#F6F1E7"/>

  <!-- Browser -->
  <rect width="1200" height="44" fill="#ECE8E3"/>
  <circle cx="26" cy="22" r="6.5" fill="#D6D0C8"/>
  <circle cx="48" cy="22" r="6.5" fill="#D6D0C8"/>
  <circle cx="70" cy="22" r="6.5" fill="#D6D0C8"/>
  <rect x="420" y="11" width="360" height="22" rx="11" fill="#FFFFFF"/>
  <text x="600" y="26.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8E8A96">Beispielprojekt · Café Kornblume</text>

  <!-- Navigation mit zentriertem Logo -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4E5B51">
    <text x="80" y="110">Speisekarte</text>
    <text x="200" y="110">Über uns</text>
    <text x="1120" y="110" text-anchor="end">Kontakt</text>
    <text x="1030" y="110" text-anchor="end">Öffnungszeiten</text>
  </g>
  <circle cx="600" cy="104" r="36" fill="#3E5C45"/>
  <g transform="translate(600 104)" fill="#7C9CF0">
    <ellipse rx="5" ry="14" transform="rotate(0) translate(0 -12)"/>
    <ellipse rx="5" ry="14" transform="rotate(60) translate(0 -12)"/>
    <ellipse rx="5" ry="14" transform="rotate(120) translate(0 -12)"/>
    <ellipse rx="5" ry="14" transform="rotate(180) translate(0 -12)"/>
    <ellipse rx="5" ry="14" transform="rotate(240) translate(0 -12)"/>
    <ellipse rx="5" ry="14" transform="rotate(300) translate(0 -12)"/>
    <circle r="6" fill="#E3A857"/>
  </g>
  <line x1="80" y1="160" x2="1120" y2="160" stroke="#E4DCCB"/>

  <!-- Hero -->
  <text x="600" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="3.5" fill="#C48A3A">CAFÉ · FRÜHSTÜCK · HAUSGEMACHTER KUCHEN</text>
  <g font-family="Georgia, 'DejaVu Serif', serif" font-size="60" fill="#2F3E33" text-anchor="middle">
    <text x="600" y="300">Frühstück, Kuchen</text>
    <text x="600" y="370">&amp; <tspan font-style="italic" fill="#3E5C45">guter Kaffee.</tspan></text>
  </g>
  <rect x="420" y="400" width="360" height="11" rx="5.5" fill="#E2D9C6"/>
  <rect x="470" y="421" width="260" height="11" rx="5.5" fill="#E2D9C6"/>

  <!-- Bildkreise -->
  <g filter="url(#shadow)">
    <circle cx="210" cy="600" r="104" fill="#E9DCC6"/>
    <circle cx="460" cy="600" r="104" fill="#F3D9B8"/>
    <circle cx="710" cy="600" r="104" fill="#DCE5D6"/>
  </g>
  <!-- Kaffee von oben -->
  <circle cx="210" cy="600" r="70" fill="#FFFFFF"/>
  <circle cx="210" cy="600" r="54" fill="url(#coffee)"/>
  <path d="M210 628 c-26 -16 -30 -36 -16 -44 c8 -4 14 0 16 8 c2 -8 8 -12 16 -8 c14 8 10 28 -16 44 z" fill="#F3E3CC" opacity="0.9"/>
  <path d="M280 570 h22 a12 12 0 0 1 0 24 h-22" fill="none" stroke="#FFFFFF" stroke-width="9"/>
  <!-- Kuchenstück -->
  <ellipse cx="460" cy="636" rx="78" ry="20" fill="#FFFFFF"/>
  <path d="M400 630 L520 630 L520 586 L400 562 Z" fill="#F7E7C9"/>
  <path d="M400 562 L520 586 L520 600 L400 576 Z" fill="#B65A4B"/>
  <path d="M400 600 L520 610 L520 616 L400 606 Z" fill="#B65A4B" opacity="0.7"/>
  <circle cx="476" cy="566" r="10" fill="#C63E3E"/>
  <path d="M476 556 c4 -10 12 -12 16 -12" fill="none" stroke="#3E5C45" stroke-width="3" stroke-linecap="round"/>
  <!-- Pflanze -->
  <path d="M684 660 h52 l-8 -46 h-36 z" fill="#C9885A"/>
  <g fill="#3E5C45">
    <ellipse cx="692" cy="574" rx="12" ry="30" transform="rotate(-28 692 574)"/>
    <ellipse cx="728" cy="574" rx="12" ry="30" transform="rotate(28 728 574)"/>
    <ellipse cx="710" cy="560" rx="12" ry="34"/>
  </g>

  <!-- Öffnungszeiten -->
  <g filter="url(#shadow)">
    <rect x="860" y="492" width="260" height="214" rx="22" fill="#3E5C45"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="890" y="538" font-size="13" font-weight="bold" letter-spacing="2.5" fill="#E3A857">ÖFFNUNGSZEITEN</text>
    <text x="890" y="582" font-size="17" fill="#FFFFFF">Mo – Fr</text>
    <text x="1090" y="582" font-size="17" text-anchor="end" fill="#FFFFFF">8 – 18 Uhr</text>
    <line x1="890" y1="600" x2="1090" y2="600" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="890" y="630" font-size="17" fill="#FFFFFF">Sa – So</text>
    <text x="1090" y="630" font-size="17" text-anchor="end" fill="#FFFFFF">9 – 17 Uhr</text>
    <text x="890" y="676" font-size="14" fill="#C9D6CC">Anfahrt ansehen →</text>
  </g>
</svg>
